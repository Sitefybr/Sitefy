<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sitefy — Sites que destacam sua marca</title>

<meta name="description" content="A Sitefy cria sites modernos, rápidos e personalizados para marcas que querem se destacar na internet.">

<style>

/* =========================================================
   RESET
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#050505;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
    overflow-x:hidden;
}

a{
    color:inherit;
}

::selection{
    background:#8b5cf6;
    color:#fff;
}


/* =========================================================
   FUNDO
========================================================= */

body::before{
    content:"";
    position:fixed;
    inset:0;
    z-index:-10;
    pointer-events:none;

    background:
        radial-gradient(
            circle at 15% 15%,
            rgba(139,92,246,.13),
            transparent 28%
        ),
        radial-gradient(
            circle at 85% 65%,
            rgba(124,58,237,.09),
            transparent 30%
        );
}

.grid-background{
    position:fixed;
    inset:0;
    z-index:-9;
    pointer-events:none;
    opacity:.18;

    background-image:
        linear-gradient(
            rgba(139,92,246,.08) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(139,92,246,.08) 1px,
            transparent 1px
        );

    background-size:70px 70px;

    mask-image:linear-gradient(
        to bottom,
        black,
        transparent 85%
    );
}

.bg-orb{
    position:fixed;
    width:450px;
    height:450px;
    border-radius:50%;
    background:rgba(139,92,246,.08);
    filter:blur(110px);
    pointer-events:none;
    z-index:-8;
}

.orb1{
    top:-220px;
    left:-180px;
}

.orb2{
    right:-220px;
    bottom:-200px;
}


/* =========================================================
   SCROLL PROGRESS
========================================================= */

.scroll-progress{
    position:fixed;
    top:0;
    left:0;
    width:0%;
    height:3px;
    z-index:9999;

    background:linear-gradient(
        90deg,
        #6d28d9,
        #8b5cf6,
        #c4b5fd,
        #7c3aed
    );

    box-shadow:
        0 0 18px rgba(139,92,246,.9);
}


/* =========================================================
   NAVBAR
========================================================= */

nav{
    position:sticky;
    top:0;
    z-index:1000;

    width:100%;
    height:78px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 5vw;

    background:rgba(5,5,5,.72);

    backdrop-filter:blur(18px);

    border-bottom:
        1px solid rgba(255,255,255,.06);
}

.logo-text{
    font-size:24px;
    font-weight:900;
    letter-spacing:-1.5px;
}

.logo-text span{
    color:#8b5cf6;
}

.nav-links{
    display:flex;
    align-items:center;
    gap:5px;
}

.nav-links a{
    text-decoration:none;
    color:#888;
    font-size:13px;
    padding:10px 14px;
    border-radius:10px;
    transition:.3s ease;
}

.nav-links a:hover{
    color:#fff;
    background:rgba(139,92,246,.1);
}

.nav-cta{
    background:#8b5cf6 !important;
    color:#fff !important;
    box-shadow:0 8px 25px rgba(139,92,246,.2);
}


/* =========================================================
   LOGO MARQUEE
========================================================= */

.logo-marquee{
    position:relative;
    width:100%;
    height:235px;
    overflow:hidden;

    display:flex;
    align-items:center;

    border-bottom:
        1px solid rgba(139,92,246,.12);

    background:
        linear-gradient(
            180deg,
            #060606,
            #080608
        );
}

.logo-marquee::before,
.logo-marquee::after{
    content:"";
    position:absolute;
    top:0;
    bottom:0;
    width:220px;
    z-index:5;
    pointer-events:none;
}

.logo-marquee::before{
    left:0;
    background:
        linear-gradient(
            90deg,
            #060606,
            transparent
        );
}

.logo-marquee::after{
    right:0;
    background:
        linear-gradient(
            270deg,
            #060606,
            transparent
        );
}

.logo-track{
    display:flex;
    width:max-content;
    animation:logoMove 28s linear infinite;
}

.logo-group{
    display:flex;
    align-items:center;
    gap:90px;
    padding-right:90px;
}

.logo-marquee img{
    width:320px;
    height:160px;
    object-fit:contain;

    filter:
        drop-shadow(
            0 0 25px rgba(139,92,246,.2)
        );

    transition:.4s ease;
}

.logo-marquee img:hover{
    transform:scale(1.08);

    filter:
        drop-shadow(
            0 0 45px rgba(139,92,246,.55)
        );
}

@keyframes logoMove{
    from{
        transform:translateX(0);
    }

    to{
        transform:translateX(-50%);
    }
}


/* =========================================================
   HERO
========================================================= */

.hero{
    min-height:calc(100vh - 78px);

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    text-align:center;

    padding:
        130px 24px 160px;

    position:relative;
}

.hero-badge{
    display:inline-flex;
    align-items:center;
    gap:9px;

    padding:9px 15px;

    border-radius:999px;

    border:
        1px solid rgba(139,92,246,.25);

    background:
        rgba(139,92,246,.07);

    color:#b7a2ef;

    font-size:11px;
    font-weight:700;

    margin-bottom:28px;

    animation:heroEnter 1s both;
}

.badge-dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:#8b5cf6;
    box-shadow:0 0 12px #8b5cf6;
}

.hero h1{
    max-width:1150px;

    font-size:
        clamp(55px,9vw,115px);

    line-height:.9;

    letter-spacing:-7px;
}

.hero h1 span{
    color:#8b5cf6;
}

.hero p{
    max-width:720px;

    margin-top:32px;

    color:#858585;

    font-size:17px;
    line-height:1.8;
}

.hero-buttons{
    display:flex;
    gap:14px;
    margin-top:38px;
}

.btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;

    text-decoration:none;
    border:0;
    cursor:pointer;

    padding:15px 25px;

    border-radius:13px;

    font-weight:800;
    font-size:13px;

    transition:
        transform .35s ease,
        box-shadow .35s ease,
        background .35s ease;
}

.btn:hover{
    transform:translateY(-4px);
}

.btn-primary{
    background:#8b5cf6;
    color:#fff;

    box-shadow:
        0 12px 40px rgba(139,92,246,.25);
}

.btn-primary:hover{
    background:#9f7aea;

    box-shadow:
        0 18px 50px rgba(139,92,246,.4);
}

.btn-secondary{
    background:rgba(255,255,255,.04);
    color:#fff;

    border:
        1px solid rgba(255,255,255,.1);
}

.hero-scroll{
    position:absolute;
    bottom:38px;

    color:#555;
    font-size:10px;
    letter-spacing:2px;
    text-transform:uppercase;

    animation:scrollFloat 2.5s ease-in-out infinite;
}

@keyframes scrollFloat{
    50%{
        transform:translateY(8px);
        opacity:.5;
    }
}

@keyframes heroEnter{
    from{
        opacity:0;
        transform:translateY(30px);
        filter:blur(10px);
    }

    to{
        opacity:1;
        transform:translateY(0);
        filter:blur(0);
    }
}


/* =========================================================
   SECTIONS
========================================================= */

section{
    width:100%;
    max-width:1450px;
    margin:auto;

    padding:
        150px 5vw;
}

.section-title{
    max-width:800px;
    margin:
        0 auto 75px;

    text-align:center;
}

.section-label{
    color:#8b5cf6;
    font-size:11px;
    font-weight:800;
    letter-spacing:2px;
    text-transform:uppercase;
}

.section-title h2{
    margin-top:12px;

    font-size:
        clamp(38px,5vw,65px);

    line-height:1;

    letter-spacing:-4px;
}

.section-title h2 span{
    color:#8b5cf6;
}

.section-title p{
    margin-top:20px;

    color:#777;

    line-height:1.8;
}


/* =========================================================
   INTRO / SOBRE
========================================================= */

.intro{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:70px;
    align-items:center;
}

.intro-visual{
    position:relative;
    min-height:510px;

    border-radius:32px;
    overflow:hidden;

    border:
        1px solid rgba(139,92,246,.2);

    background:
        linear-gradient(
            135deg,
            #100b18,
            #050505
        );

    box-shadow:
        0 35px 100px rgba(0,0,0,.45);
}

.intro-visual::before{
    content:"";
    position:absolute;
    width:300px;
    height:300px;
    border-radius:50%;

    background:#8b5cf6;
    opacity:.15;
    filter:blur(100px);

    top:-80px;
    right:-70px;
}

.intro-image{
    position:absolute;
    inset:25px;

    border-radius:22px;

    background:
        linear-gradient(
            135deg,
            rgba(139,92,246,.2),
            rgba(255,255,255,.02)
        );

    border:
        1px solid rgba(255,255,255,.08);

    overflow:hidden;
}

.intro-image::before{
    content:"SITEFY";
    position:absolute;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%)
        rotate(-8deg);

    font-size:clamp(65px,8vw,120px);
    font-weight:900;

    letter-spacing:-8px;

    color:rgba(255,255,255,.05);
}

.browser-top{
    height:46px;

    display:flex;
    align-items:center;

    gap:7px;

    padding:0 18px;

    border-bottom:
        1px solid rgba(255,255,255,.06);
}

.browser-dot{
    width:8px;
    height:8px;
    border-radius:50%;
    background:#444;
}

.browser-content{
    padding:35px;
}

.fake-line{
    width:45%;
    height:9px;
    border-radius:20px;
    background:#8b5cf6;
    margin-bottom:20px;
}

.fake-title{
    width:80%;
    height:35px;
    border-radius:8px;
    background:rgba(255,255,255,.12);
}

.fake-text{
    width:60%;
    height:10px;
    margin-top:18px;
    border-radius:20px;
    background:rgba(255,255,255,.06);
}

.fake-boxes{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
    margin-top:50px;
}

.fake-box{
    height:130px;
    border-radius:16px;

    background:
        linear-gradient(
            145deg,
            rgba(139,92,246,.22),
            rgba(255,255,255,.03)
        );

    border:
        1px solid rgba(255,255,255,.07);
}

.intro-content h2{
    font-size:
        clamp(40px,5vw,68px);

    line-height:.98;
    letter-spacing:-4px;
}

.intro-content h2 span{
    color:#8b5cf6;
}

.intro-content > p{
    color:#818181;
    line-height:1.9;
    margin-top:25px;
}

.intro-points{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;

    margin-top:35px;
}

.intro-point{
    padding:18px;

    border-radius:16px;

    background:rgba(255,255,255,.025);

    border:
        1px solid rgba(255,255,255,.06);
}

.intro-point strong{
    display:block;
    font-size:14px;
}

.intro-point span{
    display:block;
    margin-top:7px;
    color:#666;
    font-size:11px;
    line-height:1.5;
}


/* =========================================================
   NÚMEROS
========================================================= */

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);

    border-top:
        1px solid rgba(255,255,255,.07);

    border-bottom:
        1px solid rgba(255,255,255,.07);
}

.stat{
    padding:45px 25px;
    text-align:center;

    border-right:
        1px solid rgba(255,255,255,.07);
}

.stat:last-child{
    border-right:0;
}

.stat strong{
    display:block;

    font-size:
        clamp(35px,5vw,60px);

    letter-spacing:-3px;

    color:#fff;
}

.stat strong span{
    color:#8b5cf6;
}

.stat p{
    margin-top:8px;
    color:#666;
    font-size:11px;
}


/* =========================================================
   PORTFÓLIO
========================================================= */

.portfolio-grid{
    display:grid;

    grid-template-columns:
        1.4fr .8fr .8fr;

    grid-template-rows:
        280px 280px;

    gap:18px;
}

.portfolio-item{
    position:relative;
    overflow:hidden;

    border-radius:24px;

    border:
        1px solid rgba(255,255,255,.08);

    background:#0b0b0b;

    cursor:pointer;
}

.portfolio-item:first-child{
    grid-row:span 2;
}

.portfolio-bg{
    position:absolute;
    inset:0;

    transition:
        transform .7s cubic-bezier(.16,1,.3,1);
}

.portfolio-item:hover .portfolio-bg{
    transform:scale(1.08);
}

.portfolio-one{
    background:
        radial-gradient(
            circle at 70% 30%,
            rgba(139,92,246,.65),
            transparent 30%
        ),
        linear-gradient(
            135deg,
            #160d24,
            #050505 70%
        );
}

.portfolio-two{
    background:
        linear-gradient(
            135deg,
            #111,
            #26103c
        );
}

.portfolio-three{
    background:
        radial-gradient(
            circle at 30% 30%,
            rgba(139,92,246,.5),
            transparent 35%
        ),
        #0b0b0b;
}

.portfolio-four{
    background:
        linear-gradient(
            135deg,
            #080808,
            #18111f
        );
}

.portfolio-overlay{
    position:absolute;
    inset:0;

    display:flex;
    flex-direction:column;
    justify-content:flex-end;

    padding:28px;

    background:
        linear-gradient(
            transparent 25%,
            rgba(0,0,0,.85)
        );
}

.portfolio-overlay small{
    color:#a78bfa;
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:2px;
}

.portfolio-overlay h3{
    margin-top:8px;
    font-size:23px;
}

.portfolio-overlay p{
    margin-top:7px;
    color:#aaa;
    font-size:11px;
}

.portfolio-ui{
    position:absolute;

    top:55px;
    left:50%;

    transform:translateX(-50%) rotate(-4deg);

    width:65%;
    height:180px;

    border-radius:16px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.12),
            rgba(255,255,255,.025)
        );

    border:
        1px solid rgba(255,255,255,.1);

    box-shadow:
        0 25px 60px rgba(0,0,0,.5);
}

.portfolio-ui::after{
    content:"";
    position:absolute;

    width:45%;
    height:8px;

    left:15%;
    top:30%;

    border-radius:20px;

    background:#8b5cf6;

    box-shadow:
        0 35px 0 rgba(255,255,255,.08),
        0 70px 0 rgba(255,255,255,.04);
}


/* =========================================================
   PROCESSO
========================================================= */

.process{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:18px;
}

.process-step{
    position:relative;

    min-height:260px;

    padding:28px;

    border-radius:22px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.045),
            rgba(255,255,255,.015)
        );

    border:
        1px solid rgba(255,255,255,.07);

    transition:.4s ease;
}

.process-step:hover{
    transform:translateY(-8px);

    border-color:
        rgba(139,92,246,.35);
}

.process-number{
    font-size:11px;
    color:#8b5cf6;
    font-weight:900;
}

.process-step h3{
    margin-top:60px;
    font-size:20px;
}

.process-step p{
    margin-top:12px;

    color:#707070;
    line-height:1.7;
    font-size:12px;
}


/* =========================================================
   DIFERENCIAIS
========================================================= */

.features-section{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
}

.feature{
    min-height:230px;

    padding:30px;

    border-radius:22px;

    background:
        rgba(255,255,255,.025);

    border:
        1px solid rgba(255,255,255,.06);

    transition:.45s ease;
}

.feature:hover{
    transform:translateY(-10px);

    border-color:
        rgba(139,92,246,.35);

    box-shadow:
        0 25px 70px rgba(0,0,0,.35);
}

.feature-icon{
    width:45px;
    height:45px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:13px;

    background:
        rgba(139,92,246,.12);

    border:
        1px solid rgba(139,92,246,.2);

    color:#a78bfa;

    font-size:18px;
}

.feature h3{
    margin-top:25px;
    font-size:19px;
}

.feature p{
    margin-top:11px;

    color:#707070;

    font-size:12px;
    line-height:1.8;
}


/* =========================================================
   PLANOS
========================================================= */

.plans{
    display:grid;
    grid-template-columns:repeat(4,minmax(0,1fr));
    gap:20px;
}

.card{
    position:relative;
    overflow:hidden;

    padding:30px;

    min-height:510px;

    border-radius:24px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.055),
            rgba(255,255,255,.012)
        );

    border:
        1px solid rgba(255,255,255,.08);

    box-shadow:
        0 20px 60px rgba(0,0,0,.4);

    opacity:0;
    transform:translateY(45px);

    transition:
        opacity .8s ease,
        transform .8s cubic-bezier(.16,1,.3,1),
        border-color .4s ease,
        box-shadow .4s ease;
}

.card.show{
    opacity:1;
    transform:translateY(0);
}

.card:hover{
    transform:
        translateY(-12px)
        scale(1.015);

    border-color:
        rgba(139,92,246,.4);

    box-shadow:
        0 35px 90px rgba(0,0,0,.6),
        0 0 50px rgba(139,92,246,.1);
}

.card::before{
    content:"";

    position:absolute;

    width:200px;
    height:200px;

    border-radius:50%;

    top:-120px;
    right:-100px;

    background:rgba(139,92,246,.13);

    filter:blur(35px);

    transition:.6s ease;
}

.card:hover::before{
    transform:scale(1.6);
}

.card-number{
    width:44px;
    height:44px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:12px;

    color:#aaa;
    font-size:11px;

    background:
        rgba(255,255,255,.04);

    border:
        1px solid rgba(255,255,255,.08);
}

.card h3{
    margin-top:27px;
    font-size:22px;
}

.card-description{
    color:#777;
    font-size:12px;
    line-height:1.7;
    margin-top:12px;
}

.price{
    margin-top:27px;
}

.price strong{
    font-size:30px;
}

.price span{
    color:#666;
    font-size:11px;
}

.features{
    list-style:none;
    margin-top:25px;
}

.features li{
    color:#999;

    font-size:11px;

    padding:8px 0;

    border-bottom:
        1px solid rgba(255,255,255,.05);
}

.features li::before{
    content:"✓";
    color:#8b5cf6;
    margin-right:8px;
}

.card-actions{
    display:flex;
    gap:9px;
    margin-top:25px;
}

.card-actions .btn{
    flex:1;
    padding:13px 8px;
    font-size:11px;
}

.buy{
    background:#8b5cf6;
}

.terms{
    background:rgba(255,255,255,.04);
    color:#aaa;

    border:
        1px solid rgba(255,255,255,.08);
}

.featured-card{
    border-color:
        rgba(139,92,246,.4);

    background:
        radial-gradient(
            circle at 80% 10%,
            rgba(139,92,246,.2),
            transparent 40%
        ),
        linear-gradient(
            145deg,
            rgba(139,92,246,.15),
            rgba(8,8,8,.96)
        );
}

.popular{
    position:absolute;

    top:20px;
    right:20px;

    padding:6px 10px;

    border-radius:999px;

    font-size:8px;
    font-weight:900;
    letter-spacing:1px;

    color:#ddd;

    background:
        rgba(139,92,246,.15);

    border:
        1px solid rgba(139,92,246,.3);

    animation:pulse 3s infinite;
}

@keyframes pulse{
    50%{
        box-shadow:
            0 0 25px rgba(139,92,246,.3);
    }
}


/* =========================================================
   FAQ
========================================================= */

.faq{
    max-width:850px;
    margin:auto;
}

.faq-item{
    border-bottom:
        1px solid rgba(255,255,255,.08);
}

.faq-question{
    width:100%;

    padding:25px 5px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    background:none;
    border:0;

    color:#fff;

    text-align:left;

    cursor:pointer;

    font-size:14px;
    font-weight:700;
}

.faq-symbol{
    color:#8b5cf6;
    font-size:20px;

    transition:.3s ease;
}

.faq-answer{
    max-height:0;
    overflow:hidden;

    color:#777;

    font-size:12px;
    line-height:1.8;

    transition:

        linear-gradient(
            145deg,
            rgba(139,92,246,.08),
            rgba(255,255,255,.015)
        );
}

.cta::before{
    content:"";

    position:absolute;

    width:400px;
    height:400px;

    border-radius:50%;

    left:50%;
    top:50%;

    background:rgba(139,92,246,.08);

    filter:blur(100px);

    pointer-events:none;
}

    letter-spacing:-5px;

}

.cta p{
    position:relative;

    max-width:600px;

    margin:
        25px auto 35px;

    color:#777;

    line-height:1.8;
}

.cta .btn{
    position:relative;
}
