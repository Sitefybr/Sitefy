<style>
/* ============================================================
   1. TOKENS / VARIÁVEIS GLOBAIS
============================================================= */
:root{
  --bg: #07060c;
  --bg-soft: #0c0b16;
  --panel: #100e1c;
  --panel-2: #14121f;
  --border: rgba(255,255,255,0.08);
  --border-strong: rgba(255,255,255,0.16);

  --violet: #7c3aed;
  --violet-light: #a78bfa;
  --cyan: #22d3ee;
  --pink: #f472b6;

  --grad-brand: linear-gradient(135deg, var(--violet-light), var(--cyan));
  --grad-brand-2: linear-gradient(135deg, var(--violet), var(--pink));

  --text: #f5f4fb;
  --text-dim: #a1a0b5;
  --text-faint: #6f6d84;

  --radius-sm: 10px;
  --radius-md: 18px;
  --radius-lg: 28px;

  --ease: cubic-bezier(.16,.84,.44,1);
  --dur-fast: .25s;
  --dur: .55s;

  --maxw: 1240px;
  --nav-h: 78px;
}

*,*::before,*::after{ box-sizing:border-box; }
html{ scroll-behavior:smooth; }
@media (prefers-reduced-motion: reduce){
  html{ scroll-behavior:auto; }
  *,*::before,*::after{ animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; scroll-behavior:auto !important; }
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:'Inter', -apple-system, sans-serif;
  font-size:16px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}

h1,h2,h3,h4{
  font-family:'Space Grotesk', 'Inter', sans-serif;
  font-weight:600;
  line-height:1.12;
  margin:0;
  letter-spacing:-.01em;
}
p{ margin:0; }
a{ color:inherit; text-decoration:none; }
ul{ margin:0; padding:0; list-style:none; }
button{ font-family:inherit; cursor:pointer; }
img{ max-width:100%; display:block; }

.mono{ font-family:'JetBrains Mono', monospace; }

/* Foco visível para acessibilidade */
a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible{
  outline:2px solid var(--cyan);
  outline-offset:3px;
  border-radius:6px;
}

/* Scrollbar discreta */
::-webkit-scrollbar{ width:10px; }
::-webkit-scrollbar-track{ background:var(--bg); }
::-webkit-scrollbar-thumb{ background:var(--panel-2); border-radius:10px; border:2px solid var(--bg); }

.container{
  max-width:var(--maxw);
  margin:0 auto;
  padding:0 24px;
}

.section{
  position:relative;
  padding:120px 0;
}
@media (max-width:768px){
  .section{ padding:80px 0; }
}

.section-head{
  max-width:640px;
  margin:0 0 56px;
}
.eyebrow{
  display:inline-flex;
  align-items:center;
  gap:8px;
  font-family:'JetBrains Mono', monospace;
  font-size:12.5px;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--cyan);
  margin-bottom:16px;
}
.eyebrow::before{
  content:'';
  width:18px; height:1px;
  background:var(--cyan);
}
.section-head h2{
  font-size:clamp(28px, 4vw, 42px);
  color:var(--text);
}
.section-head p{
  margin-top:16px;
  color:var(--text-dim);
  font-size:17px;
  max-width:560px;
}

/* Fundo texturizado global: grid técnico sutil + glow ambiente */
.bg-grid{
  position:fixed;
  inset:0;
  z-index:-2;
  background-image:
    linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
  background-size:64px 64px;
  mask-image:radial-gradient(ellipse 80% 60% at 50% 0%, #000 40%, transparent 100%);
  pointer-events:none;
}
.bg-glow{
  position:fixed;
  inset:0;
  z-index:-3;
  background:var(--bg);
  pointer-events:none;
}
.bg-glow::before, .bg-glow::after{
  content:'';
  position:absolute;
  width:640px; height:640px;
  border-radius:50%;
  filter:blur(140px);
  opacity:.28;
}
.bg-glow::before{ top:-180px; left:-160px; background:var(--violet); }
.bg-glow::after{ top:20%; right:-220px; background:var(--cyan); opacity:.16; }

/* ============================================================
   2. CURSOR CUSTOMIZADO + SPOTLIGHT
============================================================= */
.cursor-dot, .cursor-ring{
  position:fixed;
  top:0; left:0;
  border-radius:50%;
  pointer-events:none;
  z-index:9999;
  transform:translate(-50%,-50%);
  will-change:transform;
}
.cursor-dot{
  width:6px; height:6px;
  background:var(--cyan);
  transition:opacity .2s;
}
.cursor-ring{
  width:34px; height:34px;
  border:1.5px solid rgba(167,139,250,.55);
  transition:width .2s var(--ease), height .2s var(--ease), border-color .2s, opacity .2s, background .2s;
}
.cursor-ring.is-active{
  width:56px; height:56px;
  background:rgba(124,58,237,.12);
  border-color:var(--cyan);
}
@media (hover:none), (pointer:coarse){
  .cursor-dot, .cursor-ring, .spotlight{ display:none !important; }
}

.spotlight{
  position:fixed;
  inset:0;
  z-index:1;
  pointer-events:none;
  background:radial-gradient(560px circle at var(--sx,50%) var(--sy,50%), rgba(124,58,237,.10), transparent 70%);
  transition:opacity .3s;
}

/* ============================================================
   3. BARRA DE PROGRESSO DE SCROLL
============================================================= */
.scroll-progress{
  position:fixed;
  top:0; left:0;
  height:3px;
  width:0%;
  background:var(--grad-brand);
  z-index:1001;
  box-shadow:0 0 12px rgba(34,211,238,.6);
}

/* ============================================================
   4. NAVBAR
============================================================= */
.navbar{
  position:fixed;
  top:0; left:0; right:0;
  z-index:1000;
  height:var(--nav-h);
  display:flex;
  align-items:center;
  background:transparent;
  border-bottom:1px solid transparent;
  transition:background .4s var(--ease), border-color .4s var(--ease), backdrop-filter .4s var(--ease), height .3s var(--ease);
}
.navbar.scrolled{
  background:rgba(7,6,12,.72);
  backdrop-filter:blur(16px) saturate(140%);
  -webkit-backdrop-filter:blur(16px) saturate(140%);
  border-bottom:1px solid var(--border);
  height:68px;
}
.nav-inner{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.logo{
  display:flex;
  align-items:center;
  gap:10px;
  font-family:'Space Grotesk', sans-serif;
  font-weight:700;
  font-size:21px;
  color:var(--text);
  letter-spacing:-.02em;
}
.logo .dot{
  width:9px; height:9px;
  border-radius:50%;
  background:var(--grad-brand);
  box-shadow:0 0 14px rgba(34,211,238,.7);
}
.logo span.accent{
  background:var(--grad-brand);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.nav-links{
  display:flex;
  align-items:center;
  gap:36px;
}
.nav-links a{
  position:relative;
  font-size:14.5px;
  font-weight:500;
  color:var(--text-dim);
  padding:6px 0;
  transition:color .25s;
}
.nav-links a::after{
  content:'';
  position:absolute;
  left:0; bottom:0;
  width:0%; height:1.5px;
  background:var(--grad-brand);
  transition:width .3s var(--ease);
}
.nav-links a:hover{ color:var(--text); }
.nav-links a:hover::after{ width:100%; }

.nav-actions{ display:flex; align-items:center; gap:18px; }

.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  padding:13px 26px;
  border-radius:999px;
  font-size:14.5px;
  font-weight:600;
  border:1px solid transparent;
  transition:transform .35s var(--ease), box-shadow .35s var(--ease), background .3s, border-color .3s, color .3s;
  white-space:nowrap;
}
.btn:active{ transform:scale(.97); }
.btn-primary{
  background:var(--grad-brand);
  color:#0a0714;
  box-shadow:0 8px 24px -8px rgba(124,58,237,.65);
}
.btn-primary:hover{
  transform:translateY(-2px);
  box-shadow:0 14px 32px -8px rgba(34,211,238,.55);
}
.btn-ghost{
  background:rgba(255,255,255,.03);
  border-color:var(--border-strong);
  color:var(--text);
}
.btn-ghost:hover{
  border-color:var(--cyan);
  background:rgba(34,211,238,.06);
  transform:translateY(-2px);
}
.btn-block{ width:100%; }
.btn-sm{ padding:10px 20px; font-size:13.5px; }

.nav-cta{ display:none; }
@media (min-width:980px){ .nav-cta{ display:inline-flex; } }

.burger{
  display:flex;
  flex-direction:column;
  justify-content:center;
  gap:5px;
  width:40px; height:40px;
  background:rgba(255,255,255,.04);
  border:1px solid var(--border);
  border-radius:10px;
  align-items:center;
}
.burger span{
  display:block;
  width:18px; height:1.5px;
  background:var(--text);
  transition:transform .3s var(--ease), opacity .3s;
}
.burger.is-open span:nth-child(1){ transform:translateY(6.5px) rotate(45deg); }
.burger.is-open span:nth-child(2){ opacity:0; }
.burger.is-open span:nth-child(3){ transform:translateY(-6.5px) rotate(-45deg); }

@media (max-width:979px){
  .nav-links{ display:none; }
}
@media (min-width:980px){
  .burger{ display:none; }
}

.mobile-menu{
  position:fixed;
  top:0; right:0;
  height:100%;
  width:min(320px, 84vw);
  background:rgba(10,9,18,.98);
  backdrop-filter:blur(20px);
  border-left:1px solid var(--border);
  z-index:999;
  padding:100px 28px 40px;
  display:flex;
  flex-direction:column;
  gap:8px;
  transform:translateX(100%);
  transition:transform .45s var(--ease);
}
.mobile-menu.is-open{ transform:translateX(0); }
.mobile-menu a{
  font-size:18px;
  font-weight:500;
  padding:14px 4px;
  border-bottom:1px solid var(--border);
  color:var(--text-dim);
}
.mobile-menu a:hover{ color:var(--text); }
.mobile-menu .btn{ margin-top:20px; }
.menu-overlay{
  position:fixed; inset:0;
  background:rgba(0,0,0,.5);
  z-index:998;
  opacity:0; pointer-events:none;
  transition:opacity .4s;
}
.menu-overlay.is-open{ opacity:1; pointer-events:auto; }

/* ============================================================
   5. HERO
============================================================= */
.hero{
  position:relative;
  min-height:100svh;
  display:flex;
  align-items:center;
  padding-top:var(--nav-h);
  overflow:hidden;
}
.hero-inner{
  display:grid;
  grid-template-columns:1.05fr .95fr;
  gap:60px;
  align-items:center;
  width:100%;
  padding:80px 0 60px;
}
@media (max-width:980px){
  .hero-inner{ grid-template-columns:1fr; text-align:center; padding:60px 0 40px; gap:48px; }
  .hero-badge, .hero-actions, .hero-stats{ justify-content:center; margin-inline:auto; }
}

.hero-badge{
  display:inline-flex;
  align-items:center;
  gap:9px;
  padding:8px 16px 8px 8px;
  border-radius:999px;
  border:1px solid var(--border-strong);
  background:rgba(255,255,255,.03);
  font-size:13px;
  color:var(--text-dim);
  margin-bottom:28px;
}
.hero-badge .pill{
  background:var(--grad-brand);
  color:#0a0714;
  font-weight:700;
  font-size:11px;
  padding:3px 9px;
  border-radius:999px;
}

.hero h1{
  font-size:clamp(38px, 5.6vw, 68px);
  color:var(--text);
}
.hero h1 .grad{
  background:var(--grad-brand);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.hero p.lead{
  margin-top:24px;
  font-size:18px;
  color:var(--text-dim);
  max-width:520px;
  line-height:1.7;
}
@media (max-width:980px){ .hero p.lead{ margin-inline:auto; } }

.hero-actions{
  display:flex;
  gap:16px;
  margin-top:38px;
  flex-wrap:wrap;
}

.hero-stats{
  display:flex;
  gap:40px;
  margin-top:56px;
  flex-wrap:wrap;
}
.hero-stats .stat b{
  display:block;
  font-family:'Space Grotesk', sans-serif;
  font-size:26px;
  font-weight:700;
  background:var(--grad-brand);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}
.hero-stats .stat span{
  font-size:13px;
  color:var(--text-faint);
}

/* Mockup 3D do hero — o elemento de assinatura */
.hero-visual{
  perspective:1400px;
  display:flex;
  justify-content:center;
}
.browser-mock{
  width:100%;
  max-width:460px;
  border-radius:var(--radius-lg);
  background:linear-gradient(180deg, var(--panel-2), var(--panel));
  border:1px solid var(--border-strong);
  box-shadow:0 40px 90px -30px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.02);
  transform-style:preserve-3d;
  transition:transform .15s ease-out;
  overflow:hidden;
}
.browser-bar{
  display:flex;
  align-items:center;
  gap:10px;
  padding:14px 16px;
  border-bottom:1px solid var(--border);
  background:rgba(255,255,255,.02);
}
.browser-bar .dots{ display:flex; gap:6px; }
.browser-bar .dots i{ width:9px; height:9px; border-radius:50%; background:rgba(255,255,255,.14); display:block; }
.browser-bar .url{
  flex:1;
  font-family:'JetBrains Mono', monospace;
  font-size:11px;
  color:var(--text-faint);
  background:rgba(255,255,255,.03);
  border-radius:999px;
  padding:5px 12px;
  text-align:center;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}
.browser-body{ padding:26px; display:flex; flex-direction:column; gap:16px; }
.skel-line{
  height:11px;
  border-radius:6px;
  background:linear-gradient(90deg, rgba(255,255,255,.08), rgba(255,255,255,.03));
}
.skel-hero-block{
  height:120px;
  border-radius:14px;
  background:
    radial-gradient(circle at 30% 30%, rgba(124,58,237,.5), transparent 60%),
    radial-gradient(circle at 75% 70%, rgba(34,211,238,.35), transparent 55%),
    linear-gradient(135deg, var(--panel-2), var(--panel));
  border:1px solid var(--border);
  position:relative;
  overflow:hidden;
}
.skel-hero-block::after{
  content:'';
  position:absolute; inset:0;
  background:linear-gradient(115deg, transparent 30%, rgba(255,255,255,.08) 50%, transparent 70%);
  background-size:200% 100%;
  animation:shimmer 3.2s ease-in-out infinite;
}
@keyframes shimmer{ 0%{ background-position:200% 0; } 100%{ background-position:-40% 0; } }
.skel-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
.skel-card{
  height:64px;
  border-radius:10px;
  background:rgba(255,255,255,.04);
  border:1px solid var(--border);
}
.browser-mock .pulse-dot{
  position:absolute;
  width:8px; height:8px;
  border-radius:50%;
  background:var(--cyan);
  box-shadow:0 0 0 0 rgba(34,211,238,.6);
  animation:pulse 2.2s ease-out infinite;
}
@keyframes pulse{
  0%{ box-shadow:0 0 0 0 rgba(34,211,238,.55); }
  70%{ box-shadow:0 0 0 14px rgba(34,211,238,0); }
  100%{ box-shadow:0 0 0 0 rgba(34,211,238,0); }
}

/* Formas abstratas de fundo do hero */
.hero-shapes{ position:absolute; inset:0; z-index:-1; pointer-events:none; }
.hero-shapes .line{
  position:absolute;
  background:linear-gradient(90deg, transparent, rgba(167,139,250,.5), transparent);
  height:1px;
}
.hero-shapes .l1{ top:22%; left:0; width:40%; }
.hero-shapes .l2{ top:68%; right:0; width:32%; }
.hero-shapes .ring{
  position:absolute;
  border:1px solid rgba(255,255,255,.06);
  border-radius:50%;
}
.hero-shapes .r1{ width:520px; height:520px; top:-160px; right:-120px; }
.hero-shapes .r2{ width:340px; height:340px; bottom:-120px; left:-80px; }

.particles{ position:absolute; inset:0; z-index:-1; pointer-events:none; }
.particles span{
  position:absolute;
  width:3px; height:3px;
  border-radius:50%;
  background:var(--cyan);
  opacity:.5;
  animation:float-p linear infinite;
}
@keyframes float-p{
  0%{ transform:translateY(0) translateX(0); opacity:0; }
  10%{ opacity:.6; }
  90%{ opacity:.4; }
  100%{ transform:translateY(-90vh) translateX(20px); opacity:0; }
}

.scroll-cue{
  position:absolute;
  bottom:28px; left:50%;
  transform:translateX(-50%);
  display:flex; flex-direction:column; align-items:center; gap:8px;
  font-family:'JetBrains Mono', monospace;
  font-size:11px;
  letter-spacing:.12em;
  color:var(--text-faint);
  text-transform:uppercase;
}
.scroll-cue .stick{
  width:1px; height:34px;
  background:linear-gradient(var(--cyan), transparent);
  animation:scroll-cue 1.8s ease-in-out infinite;
}
@keyframes scroll-cue{ 0%,100%{ transform:scaleY(.6); opacity:.4; } 50%{ transform:scaleY(1); opacity:1; } }

/* ============================================================
   6. REVEAL ON SCROLL (genérico)
============================================================= */
.reveal{
  opacity:0;
  transform:translateY(28px);
  transition:opacity .8s var(--ease), transform .8s var(--ease);
}
.reveal.is-visible{ opacity:1; transform:translateY(0); }
.reveal-stagger.is-visible > *{ transition-delay:calc(var(--i,0) * 90ms); }

/* ============================================================
   7. LOGOS / MARQUEE (prova social simples)
============================================================= */
.marquee-wrap{
  border-top:1px solid var(--border);
  border-bottom:1px solid var(--border);
  padding:28px 0;
  overflow:hidden;
  position:relative;
}
.marquee-wrap::before, .marquee-wrap::after{
  content:'';
  position:absolute; top:0; bottom:0; width:120px; z-index:2;
}
.marquee-wrap::before{ left:0; background:linear-gradient(90deg, var(--bg), transparent); }
.marquee-wrap::after{ right:0; background:linear-gradient(-90deg, var(--bg), transparent); }
.marquee{
  display:flex;
  gap:64px;
  width:max-content;
  animation:marquee 26s linear infinite;
}
.marquee span{
  font-family:'Space Grotesk', sans-serif;
  font-weight:600;
  font-size:19px;
  color:var(--text-faint);
  white-space:nowrap;
  letter-spacing:.02em;
}
@keyframes marquee{ 0%{ transform:translateX(0); } 100%{ transform:translateX(-50%); } }

/* ============================================================
   8. SERVIÇOS
============================================================= */
.services-grid{
  display:grid;
  grid-template-columns:repeat(3, 1fr);
  gap:22px;
}
@media (max-width:980px){ .services-grid{ grid-template-columns:repeat(2,1fr); } }
@media (max-width:640px){ .services-grid{ grid-template-columns:1fr; } }

.tilt-card{
  --mx:50%; --my:50%;
  position:relative;
  padding:32px 26px;
  border-radius:var(--radius-md);
  background:linear-gradient(160deg, var(--panel-2), var(--panel));
  border:1px solid var(--border);
  transform-style:preserve-3d;
  transition:transform .12s ease-out, border-color .3s, box-shadow .3s;
  overflow:hidden;
}
.tilt-card::before{
  content:'';
  position:absolute; inset:0;
  background:radial-gradient(220px circle at var(--mx) var(--my), rgba(167,139,250,.16), transparent 60%);
  opacity:0;
  transition:opacity .35s;
