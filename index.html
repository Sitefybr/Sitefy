<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050507">

<title>Sitefy — Sites que destacam sua marca</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#050507;
    color:#fff;
    font-family:Inter,Arial,sans-serif;
    overflow-x:hidden;
}

/* =========================================================
   SCROLL PROGRESS
========================================================= */

.scroll-progress{
    position:fixed;
    top:0;
    left:0;
    width:0%;
    height:3px;
    background:linear-gradient(90deg,#7c2cff,#d88cff,#8c3cff);
    z-index:10000;
    box-shadow:0 0 15px #9d4dff;
}

/* =========================================================
   LOADER
========================================================= */

.loader{
    position:fixed;
    inset:0;
    z-index:9999;
    background:#050507;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    transition:1s ease;
}

.loader.hide{
    opacity:0;
    pointer-events:none;
}

.loader-logo{
    font-size:48px;
    font-weight:900;
    letter-spacing:-4px;
    animation:logoPulse 1.4s infinite alternate;
}

.loader-logo span{
    color:#9d4dff;
}

.loader-line{
    width:200px;
    height:2px;
    margin-top:25px;
    background:#18181e;
    overflow:hidden;
}

.loader-line::after{
    content:"";
    display:block;
    width:60%;
    height:100%;
    background:#9d4dff;
    animation:loading 1.2s infinite;
}

@keyframes loading{
    from{transform:translateX(-120%)}
    to{transform:translateX(300%)}
}

@keyframes logoPulse{
    from{
        opacity:.4;
        transform:scale(.96);
    }

    to{
        opacity:1;
        transform:scale(1.04);
    }
}

/* =========================================================
   BACKGROUND
========================================================= */

.noise{
    position:fixed;
    inset:0;
    z-index:-5;
    pointer-events:none;
    opacity:.035;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.5'/%3E%3C/svg%3E");
}

.bg{
    position:fixed;
    inset:0;
    z-index:-4;
    overflow:hidden;
    pointer-events:none;
}

.glow{
    position:absolute;
    width:600px;
    height:600px;
    border-radius:50%;
    filter:blur(130px);
    opacity:.16;
}

.glow.one{
    background:#7d2cff;
    top:-280px;
    left:-200px;
}

.glow.two{
    background:#b44cff;
    right:-280px;
    top:30%;
}

.glow.three{
    background:#5217c9;
    left:30%;
    bottom:-400px;
}

.grid-bg{
    position:absolute;
    inset:0;
    opacity:.08;
    background-image:
        linear-gradient(rgba(157,77,255,.15) 1px,transparent 1px),
        linear-gradient(90deg,rgba(157,77,255,.15) 1px,transparent 1px);
    background-size:80px 80px;
    mask-image:linear-gradient(to bottom,transparent,black 20%,black 70%,transparent);
}

/* =========================================================
   CURSOR
========================================================= */

.cursor-light{
    position:fixed;
    width:380px;
    height:380px;
    border-radius:50%;
    pointer-events:none;
    z-index:0;
    background:radial-gradient(
        circle,
        rgba(139,55,255,.11),
        transparent 67%
    );
    transform:translate(-50%,-50%);
}

/* =========================================================
   NAV
========================================================= */

nav{
    position:fixed;
    top:0;
    left:0;
    right:0;
    z-index:100;
    padding:22px 6%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:linear-gradient(
        to bottom,
        rgba(5,5,7,.92),
        rgba(5,5,7,.35),
        transparent
    );
    backdrop-filter:blur(12px);
}

.logo{
    font-size:26px;
    font-weight:900;
    letter-spacing:-2px;
}

.logo span{
    color:#a04dff;
}

.nav-links{
    display:flex;
    gap:32px;
    list-style:none;
}

.nav-links a{
    color:#9999a2;
    text-decoration:none;
    font-size:14px;
    transition:.3s;
}

.nav-links a:hover{
    color:white;
}

.nav-btn{
    color:white;
    text-decoration:none;
    padding:11px 18px;
    border:1px solid #34343c;
    border-radius:100px;
    font-size:13px;
    transition:.3s;
}

.nav-btn:hover{
    background:#fff;
    color:#050507;
    transform:translateY(-2px);
}

@media(max-width:700px){

    .nav-links{
        display:none;
    }

    nav{
        padding:18px 20px;
    }

    .nav-btn{
        padding:9px 13px;
        font-size:11px;
    }
}

/* =========================================================
   HERO
========================================================= */

.hero{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    perspective:1400px;
    padding:120px 20px 80px;
    overflow:hidden;
}

.hero-content{
    text-align:center;
    max-width:1100px;
    position:relative;
    z-index:5;
    transform-style:preserve-3d;
    animation:heroIn 1.5s cubic-bezier(.16,1,.3,1) both;
}

@keyframes heroIn{

    from{
        opacity:0;
        transform:
            translateY(90px)
            rotateX(20deg)
            scale(.85);
    }

    to{
        opacity:1;
        transform:
            translateY(0)
            rotateX(0)
            scale(1);
    }
}

.badge{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:9px 15px;
    border:1px solid #292932;
    border-radius:100px;
    background:rgba(15,15,19,.7);
    box-shadow:0 0 40px rgba(150,70,255,.1);
    color:#bcbcc4;
    font-size:12px;
    margin-bottom:28px;
    animation:badgeFloat 4s ease-in-out infinite;
}

@keyframes badgeFloat{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-5px);
    }
}

.badge-dot{
    width:7px;
    height:7px;
    background:#a04dff;
    border-radius:50%;
    box-shadow:
        0 0 10px #a04dff,
        0 0 25px #a04dff;
    animation:dotPulse 1.5s infinite;
}

@keyframes dotPulse{

    0%,100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.5);
    }
}

.hero h1{
    font-size:clamp(58px,9vw,128px);
    line-height:.88;
    letter-spacing:-8px;
    font-weight:900;
    margin-bottom:30px;
}

.hero h1 .white{
    display:block;
}

.hero h1 .purple{
    display:block;
    background:
        linear-gradient(
            90deg,
            #812dff,
            #e0a3ff,
            #8d3cff,
            #c879ff
        );
    background-size:300%;
    -webkit-background-clip:text;
    color:transparent;
    animation:gradientMove 6s linear infinite;
}

@keyframes gradientMove{

    to{
        background-position:300%;
    }
}

.hero p{
    color:#92929a;
    max-width:620px;
    margin:auto;
    font-size:17px;
    line-height:1.7;
}

.hero-buttons{
    margin-top:40px;
    display:flex;
    justify-content:center;
    gap:14px;
}

.main-btn{
    position:relative;
    overflow:hidden;
    display:inline-block;
    text-decoration:none;
    color:#fff;
    background:#8c3cff;
    padding:16px 25px;
    border-radius:12px;
    font-weight:700;
    font-size:14px;
    box-shadow:
        0 10px 40px rgba(140,60,255,.25),
        inset 0 1px rgba(255,255,255,.25);
    transition:.35s;
}

.main-btn::before{
    content:"";
    position:absolute;
    top:0;
    left:-100%;
    width:70%;
    height:100%;
    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.35),
            transparent
        );
    transform:skewX(-20deg);
    transition:.6s;
}

.main-btn:hover::before{
    left:140%;
}

.main-btn:hover{
    transform:translateY(-5px) scale(1.04);
    box-shadow:
        0 20px 60px rgba(140,60,255,.42);
}

.secondary-btn{
    text-decoration:none;
    color:#bbb;
    padding:16px 25px;
    border:1px solid #29292f;
    border-radius:12px;
    font-weight:600;
    font-size:14px;
    transition:.3s;
}

.secondary-btn:hover{
    color:white;
    border-color:#55555f;
    transform:translateY(-4px);
}

@media(max-width:600px){

    .hero-buttons{
        flex-direction:column;
        align-items:center;
    }

    .hero h1{
        letter-spacing:-5px;
    }
}

/* =========================================================
   3D SCENE
========================================================= */

.scene{
    position:absolute;
    width:100%;
    height:100%;
    pointer-events:none;
    transform-style:preserve-3d;
}

.orb{
    position:absolute;
    width:100px;
    height:100px;
    border-radius:50%;
    background:
        radial-gradient(
            circle at 30% 25%,
            #f0d7ff,
            #8a32ff 35%,
            #260052 70%,
            #0a0013
        );
    box-shadow:
        0 0 40px #862cff,
        0 0 100px rgba(134,44,255,.5),
        inset -15px -20px 30px rgba(0,0,0,.7);
    animation:orbFloat 7s ease-in-out infinite;
    opacity:.8;
}

.orb.o1{
    left:12%;
    top:28%;
}

.orb.o2{
    right:12%;
    top:23%;
    width:60px;
    height:60px;
    animation-delay:-2s;
}

.orb.o3{
    right:18%;
    bottom:15%;
    width:35px;
    height:35px;
    animation-delay:-4s;
}

@keyframes orbFloat{

    0%,100%{
        transform:
            translate3d(0,0,0)
            rotate(0);
    }

    50%{
        transform:
            translate3d(30px,-50px,100px)
            rotate(180deg);
    }
}

.ring{
    position:absolute;
    width:500px;
    height:500px;
    border:1px solid rgba(157,77,255,.18);
    border-radius:50%;
    left:50%;
    top:50%;
    transform:
        translate(-50%,-50%)
        rotateX(68deg)
        rotateZ(15deg);
    animation:ringSpin 15s linear infinite;
}

.ring::before,
.ring::after{
    content:"";
    position:absolute;
    border-radius:50%;
}

.ring::before{
    inset:30px;
    border:1px solid rgba(157,77,255,.09);
}

.ring::after{
    inset:80px;
    border:1px solid rgba(157,77,255,.07);
}

@keyframes ringSpin{

    to{
        transform:
            translate(-50%,-50%)
            rotateX(68deg)
            rotateZ(375deg);
    }
}

/* =========================================================
   LOGO MARQUEE
========================================================= */

.logo-marquee{
    position:relative;
    width:100%;
    overflow:hidden;
    padding:18px 0;
    background:rgba(255,255,255,.96);
    border-top:1px solid rgba(157,77,255,.35);
    border-bottom:1px solid rgba(157,77,255,.35);
    box-shadow:0 0 45px rgba(157,77,255,.12);
}

.logo-track{
    display:flex;
    width:max-content;
    animation:logoMarquee 28s linear infinite;
}

.logo-set{
    display:flex;
    align-items:center;
    flex-shrink:0;
}

.logo-marquee img{
    width:250px;
    height:105px;
    object-fit:contain;
    margin:0 34px;
    filter:
        drop-shadow(
            0 8px 16px rgba(91,32,180,.18)
        );
}

.logo-separator{
    width:7px;
    height:7px;
    border-radius:50%;
    background:#8d3cff;
    box-shadow:0 0 14px rgba(141,60,255,.8);
}

@keyframes logoMarquee{

    from{
        transform:translateX(0);
    }

    to{
        transform:translateX(-50%);
    }
}

@media(max-width:700px){

    .logo-marquee img{
        width:180px;
        height:78px;
        margin:0 20px;
    }
}

/* =========================================================
   SECTIONS
========================================================= */

section{
    padding:130px 6%;
    position:relative;
}

.section-head{
    max-width:700px;
    margin-bottom:60px;
}

.eyebrow{
    color:#a04dff;
    text-transform:uppercase;
    letter-spacing:3px;
    font-size:11px;
    font-weight:800;
    margin-bottom:18px;
}

.section-head h2{
    font-size:clamp(38px,6vw,72px);
    letter-spacing:-4px;
    line-height:.95;
}

.section-head p{
    color:#85858d;
    margin-top:20px;
    line-height:1.7;
}

/* =========================================================
   STATS
========================================================= */

.stats-section{
    padding-top:80px;
    padding-bottom:90px;
}

.stats-title{
    text-align:center;
    font-size:12px;
    color:#777780;
    text-transform:uppercase;
    letter-spacing:4px;
    margin-bottom:35px;
}

.stats{
    max-width:1100px;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    border-top:1px solid #202027;
    border-bottom:1px solid #202027;
}

.stat{
    position:relative;
    text-align:center;
    padding:50px 20px;
    overflow:hidden;
}

.stat:not(:last-child)::after{
    content:"";
    position:absolute;
    right:0;
    top:25%;
    height:50%;
    width:1px;
    background:#25252d;
}

.stat::before{
    content:"";
    position:absolute;
    width:160px;
    height:160px;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    background:#8d3cff;
    filter:blur(80px);
    opacity:.06;
}

.stat-number{
    position:relative;
    font-size:clamp(42px,6vw,68px);
    font-weight:900;
    letter-spacing:-4px;
    background:linear-gradient(
        180deg,
        #fff,
        #9c9ca5
    );
    -webkit-background-clip:text;
    color:transparent;
}

.stat-number span{
    color:#9d4dff;
}

.stat-label{
    position:relative;
    color:#777780;
    margin-top:10px;
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:2px;
}

@media(max-width:700px){

    .stats{
        grid-template-columns:1fr;
    }

    .stat:not(:last-child)::after{
        right:20%;
        left:20%;
        top:auto;
        bottom:0;
        width:60%;
        height:1px;
    }
}

/* =========================================================
   CARDS
========================================================= */

.pricing{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:22px;
    max-width:1250px;
    margin:auto;
    perspective:1200px;
}

.card{
    position:relative;
    min-height:520px;
    padding:35px;
    border-radius:25px;
    border:1px solid #27272e;
    background:
        linear-gradient(
            145deg,
            rgba(26,26,32,.95),
            rgba(9,9,12,.96)
        );
    overflow:hidden;
    transform-style:preserve-3d;
    transition:
        transform .15s ease,
        border-color .4s,
        box-shadow .4s;
}

.card::before{
    content:"";
    position:absolute;
    width:300px;
    height:300px;
    background:#8d3cff;
    filter:blur(120px);
    opacity:.06;
    top:-150px;
    right:-100px;
}

.card::after{
    content:"";
    position:absolute;
    inset:0;
    border-radius:25px;
    background:
        linear-gradient(
            120deg,
            transparent 20%,
            rgba(255,255,255,.07),
            transparent 80%
        );
    transform:translateX(-120%);
    transition:1s;
}

.card:hover::after{
    transform:translateX(120%);
}

.card:hover{
    border-color:#7532bd;
    box-shadow:
        0 30px 80px rgba(0,0,0,.55),
        0 0 50px rgba(130,50,255,.08);
}

.card.featured{
    border-color:#7c38c9;
    transform:translateY(-15px);
    box-shadow:
        0 25px 90px rgba(110,40,210,.16);
}

.card.featured::before{
    opacity:.14;
}

.popular{
    position:absolute;
    right:25px;
    top:25px;
    background:#9d4dff;
    color:white;
    padding:7px 11px;
    border-radius:100px;
    font-size:10px;
    font-weight:800;
    letter-spacing:1px;
}

.card-number{
    font-size:11px;
    color:#62626b;
    font-weight:800;
    letter-spacing:2px;
    margin-bottom:50px;
}

.card h3{
    font-size:25px;
    margin-bottom:12px;
}

.card-desc{
    color:#777780;
    font-size:13px;
    line-height:1.6;
    min-height:62px;
}

.price{
    margin:30px 0;
    font-size:42px;
    font-weight:900;
    letter-spacing:-2px;
}

.features{
    list-style:none;
    display:grid;
    gap:14px;
    padding-top:25px;
    border-top:1px solid #222229;
}

.features li{
    color:#a2a2aa;
    font-size:13px;
    display:flex;
    gap:10px;
}

.features li::before{
    content:"✓";
    color:#a04dff;
    font-weight:900;
}

.card-btn{
    position:absolute;
    left:35px;
    right:35px;
    bottom:30px;
    text-align:center;
    padding:15px;
    border-radius:12px;
    border:1px solid #2c2c33;
    color:white;
    text-decoration:none;
    font-size:13px;
    font-weight:700;
    transition:.3s;
}

.card-btn:hover{
    background:#9d4dff;
    border-color:#9d4dff;
    transform:translateY(-3px);
}

@media(max-width:900px){

    .pricing{
        grid-template-columns:1fr;
        max-width:500px;
    }

    .card.featured{
        transform:none;
    }
}

/* =========================================================
   WHY SITEFY
========================================================= */

.why-grid{
    max-width:1200px;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:16px;
}

.why-card{
    position:relative;
    min-height:240px;
    padding:30px;
    border:1px solid #222229;
    border-radius:22px;
    background:
        linear-gradient(
            145deg,
            rgba(18,18,23,.9),
            rgba(8,8,11,.95)
        );
    overflow:hidden;
    transition:.5s;
}

.why-card:hover{
    transform:
        translateY(-10px)
        rotateX(3deg);
    border-color:#7838c0;
    box-shadow:
        0 25px 60px rgba(0,0,0,.45),
        0 0 35px rgba(141,60,255,.08);
}

.why-icon{
    width:48px;
    height:48px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:14px;
    background:rgba(141,60,255,.1);
    border:1px solid rgba(141,60,255,.2);
    color:#b36cff;
    font-size:21px;
    margin-bottom:30px;
}

.why-card h3{
    font-size:18px;
    margin-bottom:12px;
}

.why-card p{
    color:#777780;
    font-size:13px;
    line-height:1.7;
}

@media(max-width:900px){

    .why-grid{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:550px){

    .why-grid{
        grid-template-columns:1fr;
    }
}

/* =========================================================
   SHOWCASE
========================================================= */

.showcase{
    max-width:1200px;
    margin:auto;
}

.showcase-grid{
    display:grid;
    grid-template-columns:1.4fr .8fr;
    gap:20px;
}

.project{
    position:relative;
    min-height:340px;
    border:1px solid #292930;
    border-radius:25px;
    overflow:hidden;
    background:
        radial-gradient(
            circle at 70% 20%,
            rgba(157,77,255,.28),
            transparent 35%
        ),
        linear-gradient(
            135deg,
            #15111d,
            #07070a
        );
    transition:.5s;
}

.project:hover{
    transform:translateY(-8px);
    border-color:#7738c1;
    box-shadow:
        0 30px 80px rgba(0,0,0,.5);
}

.project.small{
    min-height:160px;
}

.project-content{
    position:absolute;
    left:30px;
    bottom:30px;
    z-index:2;
}

.project-tag{
    display:inline-block;
    color:#bd8aff;
    font-size:10px;
    letter-spacing:2px;
    text-transform:uppercase;
    margin-bottom:10px;
}

.project h3{
    font-size:30px;
    letter-spacing:-1px;
}

.project.small h3{
    font-size:22px;
}

.project p{
    color:#888892;
    font-size:12px;
    margin-top:8px;
}

.project-glow{
    position:absolute;
    width:300px;
    height:300px;
    right:-80px;
    top:-80px;
    border-radius:50%;
    background:#8d3cff;
    filter:blur(100px);
    opacity:.12;
}

.mock-window{
    position:absolute;
    right:40px;
    top:40px;
    width:45%;
    height:70%;
    border-radius:14px;
    border:1px solid rgba(255,255,255,.12);
    background:#0b0b10;
    box-shadow:0 20px 50px rgba(0,0,0,.5);
    transform:
        perspective(800px)
        rotateY(-12deg)
        rotateX(5deg);
}

.mock-top{
    height:25px
